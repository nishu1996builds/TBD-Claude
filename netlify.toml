# Netlify: connect this repo at app.netlify.com, pick the default branch, deploy.
# No build step. The whole repo is the site.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
