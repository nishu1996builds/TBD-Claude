name: Storefront Radar daily

on:
  schedule:
    - cron: "47 11 * * *" # 6:47 am Eastern (EST), 7:47 am during daylight time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull and score new business filings
        run: node pipeline/radar/run.mjs

      - name: Save results to the repo
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Radar leads for $(date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Post the daily digest as an issue (GitHub emails it to you)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create radar-digest --color 1f6b4a --description "Daily Storefront Radar digest" --force
          for n in $(gh issue list --label radar-digest --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Superseded by today's digest."
          done
          {
            cat data/radar/digest.md
            echo
            echo "Files: [leads.csv](../blob/${GITHUB_REF_NAME}/data/radar/leads.csv) · [outreach-ready.csv](../blob/${GITHUB_REF_NAME}/data/radar/outreach-ready.csv) · [source health](../blob/${GITHUB_REF_NAME}/data/radar/source-health.json)"
            echo
            echo "cc @${{ github.repository_owner }}"
          } > /tmp/digest-body.md
          gh issue create --title "Radar: new leads for $(date +%F)" --label radar-digest --body-file /tmp/digest-body.md
