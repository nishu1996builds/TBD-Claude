name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/festive-allen-pedczk]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the public site (leave out lead data, the pipeline, and paid downloads)
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude data --exclude pipeline --exclude dist --exclude marketing --exclude research ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
