<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartographer · TBD Lab</title>
<meta name="description" content="Procedural fantasy world map generator. Seeded terrain, rivers, cities, invented languages, three printable render styles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece6da;
    --desk: #ddd5c5;
    --surface: #fbf8f2;
    --ink: #1f1b16;
    --muted: #6d665b;
    --line: #ddd4c4;
    --accent: #a8442a;
    --accent-ink: #fff;
    --chip: #efe8dc;
    --shadow: 0 1px 2px rgba(30,25,15,.08), 0 10px 30px rgba(30,25,15,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12110f; --desk: #191815; --surface: #1d1c19; --ink: #f1ede5; --muted: #a39d92;
      --line: #2e2c27; --accent: #e07a54; --accent-ink: #1a0f0a; --chip: #262420;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12110f; --desk: #191815; --surface: #1d1c19; --ink: #f1ede5; --muted: #a39d92;
    --line: #2e2c27; --accent: #e07a54; --accent-ink: #1a0f0a; --chip: #262420;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  .bar {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--surface); flex: 0 0 auto; min-width: 0;
  }
  .back { font: 500 12.5px "JetBrains Mono", monospace; text-decoration: none; color: var(--muted); white-space: nowrap; }
  .back:hover { color: var(--accent); }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { margin: 0; font: 400 22px/1 "IM Fell English SC", Georgia, serif; letter-spacing: .04em; }
  .brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .spacer { flex: 1; }
  .drawer-btn { display: none; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .stage { position: relative; flex: 1 1 auto; min-width: 0; background: var(--desk); overflow: hidden; touch-action: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .stage canvas.dragging { cursor: grabbing; }
  .stage canvas.hovering { cursor: pointer; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  .zoom button {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    box-shadow: var(--shadow); cursor: pointer; font-size: 17px; line-height: 1; display: grid; place-items: center;
  }
  .zoom button:hover { color: var(--accent); }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 4;
    background: rgba(236,230,218,.35); backdrop-filter: blur(1.5px); opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .loading.on { opacity: 1; pointer-events: auto; }
  .loading div {
    background: var(--surface); padding: 10px 16px 10px 12px; border-radius: 999px; box-shadow: var(--shadow);
    display: flex; gap: 10px; align-items: center; font-weight: 500;
  }
  .loading i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .panel {
    width: 312px; flex: 0 0 312px; background: var(--surface); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 18px;
  }
  .panel h2 { margin: 0 0 8px; font: 600 11px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .seed { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .seed:focus, .seg button:focus-visible, .btn:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn {
    border: 1px solid var(--line); background: var(--chip); padding: 9px 12px; border-radius: 10px; cursor: pointer;
    font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; cursor: pointer; font-weight: 500; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); color: var(--accent); }
  .slider { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; margin-bottom: 10px; }
  .slider label { font-weight: 500; }
  .slider output { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stats { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .stats b { color: var(--ink); font-weight: 600; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }

  .lore {
    position: absolute; z-index: 5; width: 280px; max-width: calc(100% - 24px);
    background: #f6ecd6; color: #2c2014; border-radius: 6px; padding: 14px 16px 14px;
    box-shadow: 0 2px 4px rgba(40,25,10,.2), 0 14px 34px rgba(40,25,10,.28);
    border: 1px solid #c9b28a; font-family: "IM Fell English", Georgia, serif;
    opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; pointer-events: none;
  }
  .lore.on { opacity: 1; transform: none; pointer-events: auto; }
  .lore::before { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(120,85,45,.35); border-radius: 3px; pointer-events: none; }
  .lore h3 { margin: 0; font: 400 23px/1.1 "IM Fell English SC", Georgia, serif; padding-right: 22px; }
  .lore .meta { font: 500 11px "JetBrains Mono", monospace; letter-spacing: .04em; color: #7a5d3b; margin: 5px 0 8px; text-transform: uppercase; }
  .lore p { margin: 0; font-size: 15.5px; line-height: 1.42; }
  .lore .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 20px; cursor: pointer; color: #7a5d3b; padding: 4px 6px; z-index: 1; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-weight: 500; opacity: 0; transition: .2s; pointer-events: none; z-index: 50;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .scrim { display: none; }

  @media (max-width: 820px) {
    .brand span { display: none; }
    .drawer-btn { display: inline-flex; }
    .bar { padding: 8px 16px; gap: 10px; }
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 80dvh; z-index: 30;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
      transform: translateY(105%); transition: transform .25s ease; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
      padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    }
    .panel::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px; }
    .panel.open { transform: none; }
    .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 29; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .scrim.on { opacity: 1; pointer-events: auto; }
    .lore { left: 12px !important; right: 12px; bottom: 12px; top: auto !important; width: auto; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="../../index.html">&larr; TBD Lab</a>
  <div class="brand"><h1>Cartographer</h1><span id="worldLine">Procedural fantasy maps</span></div>
  <div class="spacer"></div>
  <button class="btn drawer-btn" id="drawerBtn" aria-controls="panel" aria-expanded="false">Controls</button>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="map" aria-label="Generated fantasy map" role="img"></canvas>
    <div class="zoom">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button id="zfit" title="Fit map" aria-label="Fit map to view">&#9635;</button>
    </div>
    <div class="loading" id="loading"><div><i></i><span>Surveying the coastlines</span></div></div>
    <div class="lore" id="lore" role="dialog" aria-live="polite">
      <button class="x" id="loreX" aria-label="Close">&times;</button>
      <h3 id="loreName"></h3>
      <div class="meta" id="loreMeta"></div>
      <p id="loreText"></p>
    </div>
  </div>
  <aside class="panel" id="panel">
    <section>
      <h2>Seed</h2>
      <div class="row">
        <input class="seed" id="seed" spellcheck="false" autocomplete="off" aria-label="Seed">
        <button class="btn" id="randomBtn" title="New random world">&#9861; Random</button>
      </div>
    </section>
    <section>
      <h2>Style</h2>
      <div class="seg" id="styleSeg" role="group" aria-label="Render style">
        <button data-style="parchment" aria-pressed="true">Parchment</button>
        <button data-style="atlas" aria-pressed="false">Atlas</button>
        <button data-style="night" aria-pressed="false">Night</button>
      </div>
    </section>
    <section>
      <h2>World</h2>
      <div class="slider"><label for="land">Land</label><output id="landOut"></output><input type="range" id="land" min="20" max="70" step="1"></div>
      <div class="slider"><label for="rug">Ruggedness</label><output id="rugOut"></output><input type="range" id="rug" min="0" max="100" step="1"></div>
      <div class="slider"><label for="cities">Cities</label><output id="citiesOut"></output><input type="range" id="cities" min="2" max="16" step="1"></div>
      <div class="slider"><label for="rivers">Rivers</label><output id="riversOut"></output><input type="range" id="rivers" min="0" max="40" step="1"></div>
    </section>
    <section class="actions">
      <button class="btn primary" id="dlBtn">Download PNG</button>
      <button class="btn" id="linkBtn">Copy link</button>
    </section>
    <section>
      <p class="hint">Click a city, town or village to read its lore. Scroll or pinch to zoom, drag to pan.</p>
    </section>
    <section class="stats" id="stats"></section>
  </aside>
</main>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* World constants: the map lives in a 1500 x 1000 unit space, sampled on a grid. */
const W = 1500, H = 1000;
const GW = 450, GH = 300, N = GW * GH, CS = W / GW;
const FRAME = 30;

/* ---------------- Random numbers ---------------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hashInt(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }

/* ---------------- Simplex noise (2D) ---------------- */
function makeSimplex(rand) {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const GX = new Float32Array(16), GY = new Float32Array(16);
  for (let i = 0; i < 16; i++) { GX[i] = Math.cos(i * Math.PI / 8 + 0.2); GY[i] = Math.sin(i * Math.PI / 8 + 0.2); }
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  return function (x, y) {
    const s = (x + y) * F2, i = Math.floor(x + s), j = Math.floor(y + s);
    const t = (i + j) * G2, x0 = x - i + t, y0 = y - j + t;
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
    const ii = i & 255, jj = j & 255;
    let n = 0, tt, g;
    tt = 0.5 - x0 * x0 - y0 * y0; if (tt > 0) { g = perm[ii + perm[jj]] & 15; tt *= tt; n += tt * tt * (GX[g] * x0 + GY[g] * y0); }
    tt = 0.5 - x1 * x1 - y1 * y1; if (tt > 0) { g = perm[ii + i1 + perm[jj + j1]] & 15; tt *= tt; n += tt * tt * (GX[g] * x1 + GY[g] * y1); }
    tt = 0.5 - x2 * x2 - y2 * y2; if (tt > 0) { g = perm[ii + 1 + perm[jj + 1]] & 15; tt *= tt; n += tt * tt * (GX[g] * x2 + GY[g] * y2); }
    return 99 * n;
  };
}
function fbm(nz, x, y, oct, gain) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let o = 0; o < oct; o++) { s += a * nz(x * f, y * f); n += a; a *= gain; f *= 2.03; }
  return s / n;
}

/* ---------------- Binary heap (min) ---------------- */
class Heap {
  constructor(cap) { this.k = new Float64Array(cap); this.v = new Int32Array(cap); this.n = 0; }
  push(key, val) {
    if (this.n >= this.k.length) {
      const k2 = new Float64Array(this.k.length * 2); k2.set(this.k); this.k = k2;
      const v2 = new Int32Array(this.v.length * 2); v2.set(this.v); this.v = v2;
    }
    const K = this.k, V = this.v; let i = this.n++;
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= key) break; K[i] = K[p]; V[i] = V[p]; i = p; }
    K[i] = key; V[i] = val;
  }
  pop() {
    const K = this.k, V = this.v, top = V[0], n = --this.n;
    if (n > 0) {
      const key = K[n], val = V[n]; let i = 0;
      for (;;) { let c = 2 * i + 1; if (c >= n) break; if (c + 1 < n && K[c + 1] < K[c]) c++; if (K[c] >= key) break; K[i] = K[c]; V[i] = V[c]; i = c; }
      K[i] = key; V[i] = val;
    }
    return top;
  }
}

/* ---------------- Grid helpers ---------------- */
const DX8 = [1, -1, 0, 0, 1, 1, -1, -1], DY8 = [0, 0, 1, -1, 1, -1, 1, -1];
const DD8 = [1, 1, 1, 1, Math.SQRT2, Math.SQRT2, Math.SQRT2, Math.SQRT2];
const gx = i => (i + 0.5) * CS, gy = j => (j + 0.5) * CS;
const nodeAt = (x, y) => clamp(Math.round(y / CS - 0.5), 0, GH - 1) * GW + clamp(Math.round(x / CS - 0.5), 0, GW - 1);

function chamfer(isSrc) {
  const d = new Float32Array(N);
  for (let k = 0; k < N; k++) d[k] = isSrc(k) ? 0 : 1e9;
  const D = Math.SQRT2;
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const k = j * GW + i; let v = d[k]; if (v === 0) continue;
    if (i > 0) v = Math.min(v, d[k - 1] + 1);
    if (j > 0) { v = Math.min(v, d[k - GW] + 1); if (i > 0) v = Math.min(v, d[k - GW - 1] + D); if (i < GW - 1) v = Math.min(v, d[k - GW + 1] + D); }
    d[k] = v;
  }
  for (let j = GH - 1; j >= 0; j--) for (let i = GW - 1; i >= 0; i--) {
    const k = j * GW + i; let v = d[k]; if (v === 0) continue;
    if (i < GW - 1) v = Math.min(v, d[k + 1] + 1);
    if (j < GH - 1) { v = Math.min(v, d[k + GW] + 1); if (i < GW - 1) v = Math.min(v, d[k + GW + 1] + D); if (i > 0) v = Math.min(v, d[k + GW - 1] + D); }
    d[k] = v;
  }
  return d;
}
function components(test, eight) {
  const lab = new Int32Array(N).fill(-1), sizes = [], stack = new Int32Array(N);
  let c = 0; const nn = eight ? 8 : 4;
  for (let s = 0; s < N; s++) {
    if (lab[s] !== -1 || !test(s)) continue;
    let sp = 0, size = 0; stack[sp++] = s; lab[s] = c;
    while (sp) {
      const k = stack[--sp]; size++;
      const i = k % GW, j = (k / GW) | 0;
      for (let d = 0; d < nn; d++) {
        const ni = i + DX8[d], nj = j + DY8[d];
        if (ni < 0 || nj < 0 || ni >= GW || nj >= GH) continue;
        const n = nj * GW + ni;
        if (lab[n] === -1 && test(n)) { lab[n] = c; stack[sp++] = n; }
      }
    }
    sizes.push(size); c++;
  }
  return { lab, sizes };
}

/* ---------------- Marching squares contours ---------------- */
function contour(f, thr) {
  const nE = N * 2;
  const inc0 = new Int32Array(nE).fill(-1), inc1 = new Int32Array(nE).fill(-1);
  const A = [], B = [];
  const seg = (a, b) => { const s = A.length; A.push(a); B.push(b); if (inc0[a] < 0) inc0[a] = s; else inc1[a] = s; if (inc0[b] < 0) inc0[b] = s; else inc1[b] = s; };
  for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) {
    const k = j * GW + i;
    const a = f[k] > thr, b = f[k + 1] > thr, c = f[k + GW + 1] > thr, d = f[k + GW] > thr;
    const code = (a << 3) | (b << 2) | (c << 1) | d;
    if (code === 0 || code === 15) continue;
    const top = 2 * k, bottom = 2 * (k + GW), left = 2 * k + 1, right = 2 * (k + 1) + 1;
    switch (code) {
      case 1: case 14: seg(left, bottom); break;
      case 2: case 13: seg(bottom, right); break;
      case 3: case 12: seg(left, right); break;
      case 4: case 11: seg(top, right); break;
      case 6: case 9: seg(top, bottom); break;
      case 7: case 8: seg(left, top); break;
      case 5: case 10: {
        const ctr = (f[k] + f[k + 1] + f[k + GW] + f[k + GW + 1]) / 4 > thr;
        if ((code === 5) === ctr) { seg(left, top); seg(bottom, right); } else { seg(top, right); seg(left, bottom); }
        break;
      }
    }
  }
  const pt = (e, out) => {
    const k = e >> 1, i = k % GW, j = (k / GW) | 0;
    if ((e & 1) === 0) { const t = (thr - f[k]) / (f[k + 1] - f[k]); out.push((i + 0.5 + t) * CS, (j + 0.5) * CS); }
    else { const t = (thr - f[k]) / (f[k + GW] - f[k]); out.push((i + 0.5) * CS, (j + 0.5 + t) * CS); }
  };
  const ns = A.length, vis = new Uint8Array(ns), lines = [];
  const walk = (s0, e0) => {
    const p = []; pt(e0, p); let s = s0, e = e0, closed = false;
    for (;;) {
      vis[s] = 1; const o = A[s] === e ? B[s] : A[s];
      const nx = inc0[o] === s ? inc1[o] : inc0[o];
      if (nx === s0) { closed = true; break; }
      pt(o, p);
      if (nx < 0 || vis[nx]) break;
      s = nx; e = o;
    }
    if (p.length >= 4) lines.push({ p, closed });

  /* legend */
  const ly = r.y + r.h - 22;
  const items = [['city', 'City'], ['town', 'Town'], ['village', 'Village'], ['road', 'Road']];
  let lx = r.x + 18;
  ctx.font = `${P ? 13 : 12}px ${f.label}`; ctx.textBaseline = 'middle';
  for (const [k, label] of items) {
    if (k === 'road') {
      ctx.beginPath(); ctx.moveTo(lx - 6, ly); ctx.lineTo(lx + 12, ly);
      if (P) { ctx.setLineDash([3.5, 2.6]); ctx.strokeStyle = 'rgba(139,58,34,0.9)'; ctx.lineWidth = 1.1; }
      else if (A) { ctx.strokeStyle = STYLES.atlas.road; ctx.lineWidth = 1.3; }
      else { ctx.setLineDash([2, 3]); ctx.strokeStyle = STYLES.night.road; ctx.lineWidth = 1.2; }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ink; ctx.fillText(label, lx + 17, ly + 0.5);
      lx += 22 + ctx.measureText(label).width + 14;
      continue;
    }
    const fake = { x: lx, y: ly, type: k, capital: false };
    const tmp = { settlements: [fake] };
    drawSettlements(ctx, tmp, style);
    ctx.fillStyle = ink; ctx.fillText(label, lx + 10, ly + 0.5);
    lx += 10 + ctx.measureText(label).width + 16;
  }
  ctx.restore();
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawCartouche(ctx, world, style) {
  const r = world.furniture.cart, T = world.title, f = STYLES[style].f;
  ctx.save();
  const cx = r.x + r.w / 2;
  if (style === 'parchment') {
    ctx.font = `46px ${f.sc}`;
    const nameW = textWidth(ctx, T.name, 46 * 0.12);
    const w = Math.max(r.w, nameW + 90), x = r.corner[0] ? r.x + r.w - w : r.x, ccx = x + w / 2;
    ctx.shadowColor = 'rgba(60,40,20,0.25)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
    concaveRect(ctx, x, r.y, w, r.h, 16); ctx.fillStyle = '#efe3c3'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#3a2817'; ctx.lineWidth = 1.8; ctx.stroke();
    concaveRect(ctx, x + 6, r.y + 6, w - 12, r.h - 12, 12); ctx.lineWidth = 0.7; ctx.stroke();
    ctx.fillStyle = '#3a2817'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `italic 16px ${f.label}`; ctx.fillText(T.pre, ccx, r.y + 32);
    ctx.font = `46px ${f.sc}`; spacedText(ctx, T.name, ccx, r.y + 76, 46 * 0.12, 'fill');
    ctx.beginPath(); ctx.moveTo(ccx - 110, r.y + 90); ctx.lineTo(ccx - 10, r.y + 90); ctx.moveTo(ccx + 10, r.y + 90); ctx.lineTo(ccx + 110, r.y + 90); ctx.lineWidth = 0.8; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ccx, r.y + 85); ctx.lineTo(ccx + 5, r.y + 90); ctx.lineTo(ccx, r.y + 95); ctx.lineTo(ccx - 5, r.y + 90); ctx.closePath(); ctx.fillStyle = '#9b2d20'; ctx.fill();
    ctx.fillStyle = '#4a3826'; ctx.font = `italic 13.5px ${f.label}`; ctx.fillText(T.sub, ccx, r.y + 112);
  } else if (style === 'atlas') {
    ctx.font = `700 40px ${f.label}`;
    const nameW = textWidth(ctx, T.name.toUpperCase(), 40 * 0.14);
    const w = Math.max(r.w, nameW + 70), x = r.corner[0] ? r.x + r.w - w : r.x, ccx = x + w / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.88)'; roundRect(ctx, x, r.y, w, r.h, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(35,38,43,0.45)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#c0392b'; ctx.fillRect(x + 24, r.y + 22, 28, 3);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#5b5f66';
    ctx.font = `500 12px ${f.label}`; spacedText(ctx, T.pre.toUpperCase(), x + 24, r.y + 44, 1.8, 'fill');
    ctx.fillStyle = '#1d1f24'; ctx.font = `700 40px ${f.label}`; spacedText(ctx, T.name.toUpperCase(), x + 22, r.y + 84, 40 * 0.14, 'fill');
    ctx.fillStyle = '#5b5f66'; ctx.font = `italic 13px ${f.label}`; ctx.fillText(T.sub + ' · Seed ' + world.P.seed, x + 24, r.y + 108);
    void cx;
  } else {
    ctx.font = `700 40px ${f.sc}`;
    const nameW = textWidth(ctx, T.name.toUpperCase(), 40 * 0.12);
    const w = Math.max(r.w, nameW + 80), x = r.corner[0] ? r.x + r.w - w : r.x, ccx = x + w / 2;
    ctx.fillStyle = 'rgba(5,10,24,0.82)'; ctx.fillRect(x, r.y, w, r.h);
    ctx.strokeStyle = 'rgba(160,190,240,0.55)'; ctx.lineWidth = 0.8; ctx.strokeRect(x + 4, r.y + 4, w - 8, r.h - 8);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(170,195,240,0.85)'; ctx.font = `italic 500 17px ${f.label}`; ctx.fillText(T.pre, ccx, r.y + 32);
    ctx.shadowColor = 'rgba(255,200,120,0.8)'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffe7b8'; ctx.font = `700 40px ${f.sc}`; spacedText(ctx, T.name.toUpperCase(), ccx, r.y + 76, 40 * 0.12, 'fill');
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,220,160,0.6)'; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(ccx - 100, r.y + 90); ctx.lineTo(ccx + 100, r.y + 90); ctx.stroke();
    ctx.fillStyle = 'rgba(170,195,240,0.8)'; ctx.font = `italic 500 14px ${f.label}`; ctx.fillText(T.sub, ccx, r.y + 110);
  }
  ctx.restore();
}

/* ---------------- App ---------------- */
const $ = id => document.getElementById(id);
const canvas = $('map'), stage = $('stage');
const ctx = canvas.getContext('2d');
const DEFAULTS = { land: 42, rug: 55, cities: 8, rivers: 16, style: 'parchment' };
const state = Object.assign({ seed: '' }, DEFAULTS);
let world = null, cache = null;
const view = { z: 1, cx: W / 2, cy: H / 2 };
let snapshot = null, snapView = null, crispTimer = 0;

const ADJ = ['amber', 'silver', 'misty', 'iron', 'golden', 'hollow', 'salt', 'ember', 'frost', 'willow', 'raven', 'copper', 'stone', 'quiet', 'wild', 'sunken'];
const NOUN = ['harbor', 'crown', 'fjord', 'vale', 'reach', 'isle', 'marsh', 'spire', 'coast', 'march', 'barrow', 'tide', 'hollow', 'gate', 'moor', 'shore'];
function randomSeed() { const r = Math.random; return `${pick(r, ADJ)}-${pick(r, NOUN)}-${Math.floor(r() * 900 + 100)}`; }

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const num = (k, lo, hi, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? clamp(v, lo, hi) : d; };
  state.seed = (q.get('seed') || '').slice(0, 64) || state.seed || randomSeed();
  state.land = num('land', 20, 70, DEFAULTS.land);
  state.rug = num('rug', 0, 100, DEFAULTS.rug);
  state.cities = num('cities', 2, 16, DEFAULTS.cities);
  state.rivers = num('rivers', 0, 40, DEFAULTS.rivers);
  const st = q.get('style'); state.style = STYLES[st] ? st : DEFAULTS.style;
}
function writeHash() {
  const q = new URLSearchParams({ seed: state.seed, land: state.land, rug: state.rug, cities: state.cities, rivers: state.rivers, style: state.style });
  const h = '#' + q.toString();
  if (location.hash !== h) history.replaceState(null, '', h);
}
function syncControls() {
  $('seed').value = state.seed;
  for (const k of ['land', 'rug', 'cities', 'rivers']) { $(k).value = state[k]; }
  $('landOut').textContent = state.land + '%';
  $('rugOut').textContent = state.rug;
  $('citiesOut').textContent = state.cities;
  $('riversOut').textContent = state.rivers;
  for (const b of $('styleSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.style === state.style));
}

function stageSize() { const r = stage.getBoundingClientRect(); return { w: Math.max(1, r.width), h: Math.max(1, r.height) }; }
function fitScale() { const s = stageSize(); return Math.min((s.w - 24) / W, (s.h - 24) / H); }
function clampView() {
  view.z = clamp(view.z, 1, 8);
  const s = stageSize(), k = fitScale() * view.z;
  const hw = s.w / 2 / k, hh = s.h / 2 / k;
  view.cx = hw >= W / 2 ? W / 2 : clamp(view.cx, hw, W - hw);
  view.cy = hh >= H / 2 ? H / 2 : clamp(view.cy, hh, H - hh);
}
function viewTransform() {
  const s = stageSize(), k = fitScale() * view.z;
  return { k, ox: s.w / 2 - view.cx * k, oy: s.h / 2 - view.cy * k, w: s.w, h: s.h };
}
function resizeCanvas() {
  const s = stageSize(), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = Math.round(s.w * dpr), ch = Math.round(s.h * dpr);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  return dpr;
}
function deskColor() { return getComputedStyle(document.documentElement).getPropertyValue('--desk').trim() || '#ddd5c5'; }
function drawCrisp() {
  if (!world) return;
  const dpr = resizeCanvas();
  clampView();
  const t = viewTransform();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = deskColor(); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(t.k * dpr, 0, 0, t.k * dpr, t.ox * dpr, t.oy * dpr);
  ctx.save(); ctx.shadowColor = 'rgba(40,30,15,0.35)'; ctx.shadowBlur = 24 * t.k * dpr; ctx.shadowOffsetY = 6;
  ctx.fillStyle = STYLES[state.style].bg; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  renderMap(ctx, world, state.style, cache);
  ctx.restore();
  if (!snapshot) snapshot = document.createElement('canvas');
  snapshot.width = canvas.width; snapshot.height = canvas.height;
  snapshot.getContext('2d').drawImage(canvas, 0, 0);
  snapView = { k: t.k, ox: t.ox, oy: t.oy };
}
function drawFast() {
  if (!snapshot || !snapView) return drawCrisp();
  const dpr = resizeCanvas();
  clampView();
  const t = viewTransform();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = deskColor(); ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = t.k / snapView.k;
  ctx.imageSmoothingEnabled = true;
  ctx.setTransform(s, 0, 0, s, (t.ox - snapView.ox * s) * dpr, (t.oy - snapView.oy * s) * dpr);
  ctx.drawImage(snapshot, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  clearTimeout(crispTimer);
  crispTimer = setTimeout(drawCrisp, 140);
}

let genToken = 0;
function regenerate() {
  const my = ++genToken;
  $('loading').classList.add('on');
  hideLore();
  setTimeout(() => {
    if (my !== genToken) return;
    try {
      world = generateWorld({ seed: state.seed, land: state.land, rug: state.rug, cities: state.cities, rivers: state.rivers });
      cache = { rasters: {}, labels: {} };
      view.z = 1; view.cx = W / 2; view.cy = H / 2;
      const r0 = performance.now();
      drawCrisp();
      world.renderMs = performance.now() - r0;
      updateStats();
    } finally {
      $('loading').classList.remove('on');
    }
  }, 30);
  writeHash();
}
function restyle() {
  if (!world) return;
  writeHash();
  drawCrisp();
  updateStats();
}
function updateStats() {
  if (!world) return;
  const c = t => world.settlements.filter(s => s.type === t).length;
  $('worldLine').textContent = `${world.title.pre} ${world.title.name}`;
  document.title = `${world.title.name} · Cartographer`;
  const realms = world.regions.map(r => r.name).join(', ');
  $('stats').innerHTML = `<b>${esc(world.title.pre)} ${esc(world.title.name)}</b><br>` +
    `${world.regions.length} realms: ${esc(realms)}<br>` +
    `${c('city')} cities, ${c('town')} towns, ${c('village')} villages, ${world.riverNames.length} rivers<br>` +
    `Generated in ${Math.round(world.genMs)} ms, drawn in ${Math.round(world.renderMs || 0)} ms`;
  window.__carto = { genMs: world.genMs, renderMs: world.renderMs, settlements: world.settlements.length, regions: world.regions.length, rivers: world.rivers.length, labels: cache.labels[state.style] ? cache.labels[state.style].length : 0, name: world.title.name, prof: world.prof };
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* lore cards */
function hideLore() { $('lore').classList.remove('on'); }
function showLore(s, sx, sy) {
  const L = loreFor(world, s);
  $('loreName').textContent = L.name; $('loreMeta').textContent = L.meta; $('loreText').textContent = L.text;
  const el = $('lore'), st = stageSize();
  el.style.left = '0px'; el.style.top = '0px';
  el.classList.add('on');
  const bw = el.offsetWidth, bh = el.offsetHeight;
  let x = sx + 16, y = sy - bh / 2;
  if (x + bw > st.w - 12) x = sx - 16 - bw;
  x = clamp(x, 12, Math.max(12, st.w - bw - 12)); y = clamp(y, 12, Math.max(12, st.h - bh - 12));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function settlementAt(px, py) {
  if (!world) return null;
  const t = viewTransform();
  const wx = (px - t.ox) / t.k, wy = (py - t.oy) / t.k;
  let best = null, bd = Math.max(14 / t.k, 9);
  for (const s of world.settlements) { const d = Math.hypot(s.x - wx, s.y - wy); if (d < bd) { bd = d; best = s; } }
  return best;
}

/* pointer handling: pan, pinch, click */
const pointers = new Map();
let gesture = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pointers.size === 1) gesture = { type: 'pan', sx: e.offsetX, sy: e.offsetY, cx: view.cx, cy: view.cy, moved: 0, t: performance.now() };
  else if (pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: view.cx, cy: view.cy, moved: 99 };
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) {
    const s = settlementAt(e.offsetX, e.offsetY); canvas.classList.toggle('hovering', !!s); return;
  }
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (!gesture) return;
  const k = fitScale();
  if (gesture.type === 'pan' && pointers.size === 1) {
    const dx = e.offsetX - gesture.sx, dy = e.offsetY - gesture.sy;
    gesture.moved = Math.max(gesture.moved, Math.hypot(dx, dy));
    if (gesture.moved > 4 && view.z > 1) { canvas.classList.add('dragging'); view.cx = gesture.cx - dx / (k * view.z); view.cy = gesture.cy - dy / (k * view.z); drawFast(); }
  } else if (gesture.type === 'pinch' && pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt(gesture.mx, gesture.my, clamp(gesture.z * d / gesture.d, 1, 8) / view.z);
  }
});
const endPointer = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  canvas.classList.remove('dragging');
  if (gesture && gesture.type === 'pan' && gesture.moved <= 5 && pointers.size === 0 && e.type === 'pointerup') {
    const s = settlementAt(e.offsetX, e.offsetY);
    if (s) showLore(s, e.offsetX, e.offsetY); else hideLore();
  }
  if (pointers.size === 0) gesture = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
function zoomAt(px, py, factor) {
  const t = viewTransform();
  const wx = (px - t.ox) / t.k, wy = (py - t.oy) / t.k;
  view.z = clamp(view.z * factor, 1, 8);
  const k = fitScale() * view.z, s = stageSize();
  view.cx = wx - (px - s.w / 2) / k; view.cy = wy - (py - s.h / 2) / k;
  hideLore();
  drawFast();
}
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0018))); }, { passive: false });
canvas.addEventListener('dblclick', e => zoomAt(e.offsetX, e.offsetY, 2));
$('zin').onclick = () => { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, 1.6); };
$('zout').onclick = () => { const s = stageSize(); zoomAt(s.w / 2, s.h / 2, 1 / 1.6); };
$('zfit').onclick = () => { view.z = 1; view.cx = W / 2; view.cy = H / 2; hideLore(); drawCrisp(); };
$('loreX').onclick = hideLore;

/* controls */
let debounce = 0;
const later = fn => { clearTimeout(debounce); debounce = setTimeout(fn, 260); };
$('seed').addEventListener('change', () => { state.seed = $('seed').value.trim().slice(0, 64) || randomSeed(); syncControls(); regenerate(); });
$('seed').addEventListener('keydown', e => { if (e.key === 'Enter') $('seed').blur(); });
$('randomBtn').onclick = () => { state.seed = randomSeed(); syncControls(); regenerate(); };
for (const k of ['land', 'rug', 'cities', 'rivers']) {
  $(k).addEventListener('input', () => { state[k] = parseInt($(k).value, 10); syncControls(); later(regenerate); });
}
$('styleSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.style = b.dataset.style; syncControls(); restyle();
});
$('dlBtn').onclick = () => {
  if (!world) return;
  const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
  const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0);
  renderMap(x, world, state.style, cache);
  c.toBlob(blob => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cartographer-${world.title.name.toLowerCase()}-${state.style}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Map saved at 3000 x 2000');
  }, 'image/png');
};
$('linkBtn').onclick = async () => {
  writeHash();
  try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
  catch (err) { toast('Copy the address bar to share'); }
};
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
const openDrawer = open => { $('panel').classList.toggle('open', open); $('scrim').classList.toggle('on', open); $('drawerBtn').setAttribute('aria-expanded', String(open)); };
$('drawerBtn').onclick = () => openDrawer(!$('panel').classList.contains('open'));
$('scrim').onclick = () => openDrawer(false);
window.addEventListener('hashchange', () => {
  const before = JSON.stringify(state);
  readHash(); syncControls();
  const a = JSON.parse(before);
  if (a.seed !== state.seed || a.land !== state.land || a.rug !== state.rug || a.cities !== state.cities || a.rivers !== state.rivers) regenerate();
  else if (a.style !== state.style) restyle();
});
let rsT = 0;
window.addEventListener('resize', () => { if (world) drawFast(); clearTimeout(rsT); rsT = setTimeout(drawCrisp, 120); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => drawCrisp());

/* boot: wait briefly for map fonts so labels measure correctly */
readHash(); syncControls();
const FONT_SPECS = ['16px "IM Fell English"', 'italic 16px "IM Fell English"', '16px "IM Fell English SC"', '500 16px Cinzel', '700 16px Cinzel', 'italic 500 16px "Cormorant Garamond"', '600 16px "Cormorant Garamond"', '16px "Alegreya Sans"', 'italic 16px "Alegreya Sans"', '500 16px "Alegreya Sans"', '700 16px "Alegreya Sans"'];
const fontsReady = document.fonts && document.fonts.load ? Promise.race([Promise.all(FONT_SPECS.map(f => document.fonts.load(f).catch(() => null))), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
$('loading').classList.add('on');
fontsReady.then(() => {
  regenerate();
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { if (cache) { cache.labels = {}; drawCrisp(); } });
});
})();
</script>
